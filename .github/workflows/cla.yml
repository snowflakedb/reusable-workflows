---
name: CLA

on:
  workflow_call:
    secrets:
      CLA_APP_CLIENT_ID:
        required: true
      CLA_APP_PRIVATE_KEY:
        required: true

jobs:
  cla:
    name: signature check
    # github.* is the CALLER's context: caller repo, caller PR, caller comment.
    if: >-
      github.event.repository.visibility == 'public'
      && (
        github.event_name == 'pull_request_target'
        || (
          github.event.issue.pull_request != null
          && (
            github.event.comment.body == 'recheck'
            || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          )
        )
      )
    runs-on: ubuntu-latest
    # Serializes runs for the same PR. Repository-scoped, so it does not
    # prevent cross-repo races on the shared signatures file.
    concurrency:
      group: cla-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Mint scoped installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLA_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          owner: snowflakedb
          repositories: cla-db
          permission-contents: write

      - name: CLA check
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          path-to-signatures: signatures/version1.json
          path-to-document: https://github.com/snowflakedb/CLA/blob/main/README.md
          branch: main
          remote-organization-name: snowflakedb
          remote-repository-name: cla-db
          allowlist: dependabot[bot],github-actions,Jenkins User,_jenkins,sfc-gh-snyk-sca-sa,snyk-bot
